name: Android Zygisk & Evdev Build (Snapdragon 680)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 1. Clone Dobby source
      - name: Clone Dobby Hooking Engine
        run: |
          git clone --depth 1 https://github.com/LSPosed/Dobby.git /tmp/dobby

      # 2. Build Dobby from source using CMake and the Android NDK
      - name: Build Dobby Static Library
        run: |
          cd /tmp/dobby
          mkdir -p build && cd build
          # Force static library generation (disable shared library)
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-33 \
                -DCMAKE_BUILD_TYPE=Release \
                -DDOBBY_GENERATE_SHARED=OFF ..
          make -j$(nproc)

      # 3. Copy the compiled library and headers into your jni/ folder
      - name: Prepare Dobby Prebuilts inside JNI
        run: |
          # Dynamically find libdobby.a and copy it to the expected location
          find /tmp/dobby/build -name "libdobby.a" -exec cp {} zygisk-anti-detect/jni/libdobby.a \;
          
          # Copy headers
          mkdir -p zygisk-anti-detect/jni/dobby_includes
          cp -r /tmp/dobby/include/* zygisk-anti-detect/jni/dobby_includes/

          echo "--- Содержимое папки jni ---"
          ls -la zygisk-anti-detect/jni/

      # 4. Download zygisk.hpp directly into the jni folder
      - name: Download official zygisk.hpp API
        run: |
          curl -L -o zygisk-anti-detect/jni/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      # 5. Run ndk-build
      - name: Build Zygisk Module & Evdev via ndk-build
        run: |
          cd zygisk-anti-detect
          
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build NDK_PROJECT_PATH=. APP_ABI=arm64-v8a
          
          cd ../
          
          # Compile the native injector
          $ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++ \
          evdev-input/human_touch.cpp \
          -o human_touch \
          -static-libstdc++

      - name: Upload Compiled Assets
        uses: actions/upload-artifact@v4
        with:
          name: zygisk_antifraud_bypass_assets
          path: |
            zygisk-anti-detect/libs/arm64-v8a/libantifraud_bypass.so
            human_touch