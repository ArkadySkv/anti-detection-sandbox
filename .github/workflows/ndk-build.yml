name: Android Zygisk & Evdev Build (Snapdragon 680)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Clone and Build Dobby Engine
        run: |
          # Клонируем исходники Dobby строго в папку jni вашего проекта
          git clone --depth 1 https://github.com/LSPosed/Dobby.git zygisk-anti-detect/jni/dobby
          
          cd zygisk-anti-detect/jni/dobby
          mkdir -p build && cd build
          
          # Собираем Dobby через CMake с помощью Android NDK
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-33 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          
          # Создаем папку, которую требует ваш Android.mk, и копируем туда собранную библиотеку
          mkdir -p ../android-prebuilt/arm64-v8a
          find . -name "libdobby.a" -exec cp {} ../android-prebuilt/arm64-v8a/ \;

      - name: Download official zygisk.hpp API
        run: |
          curl -L -o zygisk-anti-detect/jni/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Build Zygisk Module & Evdev via ndk-build
        run: |
          cd zygisk-anti-detect
          
          # Запускаем ndk-build (он подхватит libdobby.a из созданной папки)
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build NDK_PROJECT_PATH=. APP_ABI=arm64-v8a
          
          cd ../
          
          # Компилируем нативный ПФ-инжектор под процессор Snapdragon 680
          $ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++ \
          evdev-input/human_touch.cpp \
          -o human_touch \
          -static-libstdc++

      - name: Upload Compiled Assets
        uses: actions/upload-artifact@v4
        with:
          name: zygisk_antifraud_bypass_assets
          path: |
            zygisk-anti-detect/libs/arm64-v8a/libantifraud_bypass.so
            human_touch