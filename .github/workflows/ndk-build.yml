name: Android NDK Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Используем встроенный в Ubuntu Runner инструмент sdkmanager для точечной установки NDK
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Build C++ Evdev Component
        run: |
          $ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++ \
          evdev-input/human_touch.cpp \
          -o human_touch \
          -static-libstdc++

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: human_touch_binary
          path: human_touch
