name: Android Zygisk & Evdev Build (Snapdragon 680)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 1. Клонируем официальный репозиторий Dobby во временную папку сервера
      - name: Clone Dobby Hooking Engine
        run: |
          git clone --depth 1 https://github.com/LSPosed/Dobby.git /tmp/dobby

      # 2. Переносим готовую либу и заголовочные файлы в jni/ по прямым путям
      - name: Prepare Dobby Prebuilts inside JNI
        run: |
          # Копируем скомпилированную авторами либу для arm64-v8a
          cp /tmp/dobby/android-prebuilt/arm64-v8a/libdobby.a zygisk-anti-detect/jni/libdobby.a
          
          # Копируем заголовочные файлы
          mkdir -p zygisk-anti-detect/jni/dobby_includes
          cp -r /tmp/dobby/include/* zygisk-anti-detect/jni/dobby_includes/

      # 3. Скачиваем официальный zygisk.hpp API
      - name: Download official zygisk.hpp API
        run: |
          curl -L -o zygisk-anti-detect/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      # 4. Запускаем компиляцию
      - name: Build Zygisk Module & Evdev via ndk-build
        run: |
          cd zygisk-anti-detect
          
          # ndk-build отработает мгновенно, так как dobby уже скомпилирован
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build NDK_PROJECT_PATH=. APP_ABI=arm64-v8a
          
          cd ../
          
          # Компилируем нативный ПФ-инжектор
          $ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++ \
          evdev-input/human_touch.cpp \
          -o human_touch \
          -static-libstdc++

      - name: Upload Compiled Assets
        uses: actions/upload-artifact@v4
        with:
          name: zygisk_antifraud_bypass_assets
          path: |
            zygisk-anti-detect/libs/arm64-v8a/libantifraud_bypass.so
            human_touch
